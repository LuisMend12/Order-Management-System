syntax = "proto3";

package orders.v1;

option go_package = "github.com/ArdiDev1/Order-Management-System/services/common/genproto/orders/v1;ordersv1";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {}
}

message Order {
  int32 order_id = 1;
  int32 customer_id = 2;
  int32 product_id = 3;
  int32 quantity = 4;
}

message CreateOrderRequest {
  int32 customer_id = 1;
  int32 product_id = 2;
  int32 quantity = 3;
}

message CreateOrderResponse {
  string status = 1;
}

message GetOrderResponse {
  string status = 1;
}

message GetOrdersRequest {
  string status = 1;
}

message GetOrdersResponse {
  repeated Order orders = 1;
}
